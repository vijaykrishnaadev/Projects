spring:
  application:
    name: spring-project
  datasource:
    url: jdbc:h2:mem:ecomdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.ecommerce.api: DEBUG
    org.hibernate.SQL: DEBUG
